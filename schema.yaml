# Title shown in Application Information tab.
title: "Postgres SQL for OCI Deployment"
# Sub Title shown in Application Information tab.
description: "This Oracle Resource manager / Terraform stack will help to deploy  Postgres SQL for OCI  either using existing VCN/Subnet or on new VCN/Subnet"
schemaVersion: 1.1.0
version: "20190304"

# URL of Logo Icon used on Application Information tab. Logo must be 130x130 pixels.

logoUrl: data:image/svg+xml;base64,

source:
  type: web


locale: "en"
variableGroups:
  - title: "Basic Hidden"
    variables:
    - tenancy_ocid
    - region
    visible: false

  - title: "PostgreSQL DBSystem Configuration"
    variables:
    - compartment_ocid
    - psql_displayname
    - psql_version 
    - node_count
    - ocpu
    - psql_shape_family
    - psql_shape_type
    - storage_iops
    - psql_admin
    - psql_admin_password
    - use_vault
    - create_vault
    - vault_id
  
  - title: "PostgreSQL Configure Extensions"
    variables:
    - create_psql_configuration
    - psql_configuration_ocid
    - psql_config_display_name
    - psql_config_description
    - psql_config_is_flexible
    - psql_config_compatible_shapes
    - psql_config_overrides
  

  - title: "Network Configuration"
    variables:
    - create_vcn_subnet
    - create_service_gateway
    - vcn_id
    - psql_subnet_ocid
    - nsg_id
    - vcn_cidr   



variables:
  compartment_ocid: 
    type: oci:identity:compartment:id
    title: "PostgreSQL Compartment"
    default: compartment_ocid
    required: true

  psql_displayname:
   type: string
   title: "PostgreSQL DB system Display Name"
   required: true
   visible: true

  psql_version:
    type: number
    title: "PSQL Version"
    required: true
    visible: true

  node_count:
    type: number
    title: "Node Count"
    required: true
    visible: true
 
  ocpu:
    type: number
    title: "# of OCPUs"
    required: true
    visible: true
  
  psql_shape_family:
    type: enum
    title: "PostgreSQL Instance family. e4 or e5 or Standard3"
    enum:
      - "e4"
      - "e5"
      - "standard3"
    required: true
    visible: true

  psql_shape_type:
    type: enum
    title: "Filter shapes"
    enum:
      - "Fixed"
      - "Flex"
    required: true
    visible: true

  storage_iops:
    type: enum
    title: "Storage IOPS (75K , 150K , 225K , 300K) "
    enum:
      - 75
      - 150
      - 225
      - 300
    required: true
    visible: true

  psql_admin:
    type: string
    title: "PSQL ADMIN Username "
    required: true
    visible: true

  psql_admin_password:
    type: string
    title: "Password Text(optional)"
    required: false
    visible: true

  use_vault:
    type: boolean
    title: "Use Vault "
    required: true
    visible: true

  create_vault:
    type: boolean
    title: "Create Vault"
    required: false
    visible: 
     and:
     - use_vault

  vault_id:
    type: oci:kms:vault:id 
    title: "Vault OCID"
    dependsOn:
      compartmentId: compartment_ocid
    required: false
    visible: 
      not:
      - create_vault 
      and:
      - use_vault
      

  create_psql_configuration:
    type: boolean
    title: "Enable Psql Extensions and Configurations"
    required: true
    visible: true

  psql_configuration_ocid:
    type: string
    title: "Existing PostgreSQL configuration if any"
    required: false
    visible: 
    - create_psql_configuration

  psql_config_display_name:
    type: string
    required: false
    visible: 
    - create_psql_configuration

  psql_config_description:
    type: string
    required: false
    visible: 
    - create_psql_configuration

  psql_config_is_flexible:
    type: boolean
    required: true
    visible: 
    - create_psql_configuration

  psql_config_compatible_shapes:
    type: string
    required: false
    visible: false

  psql_config_overrides:
    type: string
    required: false
    visible: 
    - create_psql_configuration

  
  create_vcn_subnet:
    type: boolean
    required: true
    visible:  true
  
  create_service_gateway:
    type: boolean
    required: true
    visible:  
    and:
     - create_vcn_subnet 
    not:
     - vcn_id 

  vcn_cidr:
    type: string
    required: true
    visible:  
     and:
     - create_vcn_subnet  
     not:
     - vcn_id  

  vcn_id:
    type: oci:core:vcn:id
    title: "Existing VCN OCID"
    dependsOn:
      compartmentId: compartment_ocid
    required: true
    visible:  
     not: 
     - create_vcn_subnet  
  
  psql_subnet_ocid:
    type: oci:core:subnet:id
    title: "PostgreSQL DB subnet OCID"
    dependsOn:
      vcnId: vcn_id
      compartmentId: compartment_ocid
    required: true
    visible:  
     not:
     - create_vcn_subnet 

  nsg_id:
    type: oci:core:nsg:id
    title: "Existing NSG OCID"
    dependsOn:
      compartmentId: compartment_ocid
      vcnId: vcn_id
    required: true
    visible:  
     not: 
     - create_vcn_subnet
  
  
